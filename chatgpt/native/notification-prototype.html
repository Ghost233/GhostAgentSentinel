<title>GhostSentinel · 通知设计原型</title>
<style>
  :root{color-scheme:dark;--bg:#101315;--panel:#191d20;--line:#31383c;--text:#f0f3f4;--muted:#a0a9ad;--accent:#a7e7ca;--amber:#e8c38a;--red:#f1aaa2;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{cursor:default}a{color:var(--accent)}.shell{max-width:1440px;margin:auto;padding:34px 44px 140px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;font-weight:600;letter-spacing:.01em}.brand-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:#173428;font-size:13px;font-weight:800}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--muted);font-size:12px}.intro{margin:51px 0 27px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.12em;font-weight:600}.intro h1{font-size:clamp(28px,3vw,43px);font-weight:600;letter-spacing:-.04em;line-height:1.25;margin:11px 0 15px}.intro p{color:var(--muted);margin:0;max-width:780px}.controls{display:flex;align-items:center;gap:8px;margin-bottom:22px;flex-wrap:wrap}.seg{display:flex;gap:3px;background:#1b2023;border:1px solid var(--line);padding:4px;border-radius:11px}.seg button{background:transparent;border:0;border-radius:7px;padding:7px 16px;font-size:13px;color:var(--muted)}.seg button[aria-pressed=true]{background:#343c40;color:var(--text)}.controls .hint{margin-left:auto;color:var(--muted);font-size:12px}.stage{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:535px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#1b2023}.workspace{min-width:0;display:grid;grid-template-columns:164px 1fr;background:#15191c}.sidebar{padding:22px 13px;border-right:1px solid #2b3236;background:#171c1f}.sidebar-title{font-size:11px;letter-spacing:.08em;color:#7d898e;padding:5px 9px 18px}.project{padding:8px 10px;color:#d3dadc;font-size:12px}.chat-nav{display:block;border:0;background:transparent;color:#9ba6ab;font-size:12px;width:100%;text-align:left;padding:10px;border-radius:7px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-nav.active{background:#2c3639;color:#e9efec}.window{min-width:0;padding:22px 27px;display:flex;flex-direction:column}.window-top{font-size:12px;color:#8e9a9f;display:flex;justify-content:space-between}.window-top span:last-child{color:#b5cfbf}.conversation{margin:auto 0;padding:30px 0}.conversation .context-label{color:#8e9a9f;font-size:11px;margin-bottom:10px}.conversation h2{font-size:24px;line-height:1.35;letter-spacing:-.03em;font-weight:550;margin:0 0 14px}.request{color:#a6b1b6;font-size:13px;margin:0 0 22px;max-width:420px}.message{border-left:2px solid #3c5349;padding-left:13px;color:#bfcac5;font-size:13px;max-width:440px}.compose{border:1px solid #343d42;background:#1e2529;border-radius:11px;padding:14px;color:#738188;font-size:12px}.notice-area{padding:23px;background:radial-gradient(ellipse at 100% 0,#3d4a47 0,transparent 80%),#252e30;display:flex;flex-direction:column;position:relative;border-left:1px solid #3a4546}.os-label{display:flex;justify-content:space-between;align-items:center;color:#d0dad5;font-size:12px;margin-bottom:28px}.os-label strong{font-weight:500}.os-label span{color:#a3b3ac;font-size:11px}.notification{width:100%;text-align:left;background:linear-gradient(135deg,#434a4aef,#333b3cf5);border:1px solid #67727090;box-shadow:0 12px 30px #0002,inset 0 1px #ffffff0d;border-radius:19px;padding:17px 17px 18px;position:relative;transition:transform .15s,border-color .15s}.notification:hover{transform:translateY(-2px);border-color:#b0c9bb}.app-line{display:flex;align-items:center;gap:8px;font-size:10px;color:#c3ceca;margin-bottom:10px;letter-spacing:.03em}.app-line time{margin-left:auto;color:#aebcb6}.app-icon{width:21px;height:21px;background:#9ed4bd;color:#183e2e;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:10px}.notice-title{font-size:16px;font-weight:650;line-height:1.4;margin:0 0 3px;letter-spacing:-.01em}.notice-subtitle{font-size:12px;font-weight:500;color:#d7dfdb;margin-bottom:8px}.notice-body{font-size:12px;line-height:1.65;color:#d4ddda;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.notice-body strong{color:white;font-weight:500}.notice-foot{display:flex;align-items:center;gap:6px;color:#a5d7bf;font-size:10px;margin-top:12px}.notice-foot:before{content:'↗';font-size:13px}.state-dot{display:inline-block;width:6px;height:6px;background:var(--amber);border-radius:50%;margin-right:5px;vertical-align:2px}.state-dot.alert{background:var(--red)}.secondary{margin-top:11px;opacity:.78;transform:scale(.97);transform-origin:top center;padding:13px 16px}.secondary .notice-title{font-size:13px}.secondary .notice-body{font-size:11px;-webkit-line-clamp:2}.native-note{font-size:11px;line-height:1.7;color:#bac9c1;margin-top:auto;padding-top:27px}.native-note b{color:#dbe5df;font-weight:500}.brief{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:35px;margin-top:28px;padding:0 5px}.brief h3{font-size:13px;font-weight:550;margin:0 0 8px}.brief p{margin:0;color:var(--muted);font-size:12px;line-height:1.85}.variant-mark{color:var(--accent);font-size:11px;font-weight:600;margin-right:6px}.prototype-bar{position:fixed;z-index:10;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;background:#edf4ef;color:#183326;border:1px solid #c9d5cc;box-shadow:0 8px 40px #0008;border-radius:99px;padding:6px 9px}.prototype-bar button{border:0;background:transparent;border-radius:50%;width:37px;height:37px;display:grid;place-items:center;color:#183326;font-size:20px}.prototype-bar button:hover{background:#d6e4db}.prototype-bar .variant-button{font-size:12px;width:29px;height:29px}.prototype-bar .variant-button[aria-current=true]{background:#224634;color:#e2ffec}.prototype-label{font-size:12px;min-width:153px;text-align:center;padding:0 10px;border-right:1px solid #c7d8ce}.toast{min-height:24px;color:var(--accent);font-size:12px;margin-top:15px}.affected-list{display:grid;gap:9px}.affected-item{display:block;text-align:left;border:1px solid #35423c;background:#1e2b24;border-radius:9px;padding:11px 13px;width:100%}.affected-item strong{display:block;font-size:13px;font-weight:500}.affected-item span{font-size:11px;color:#a5bab0}.sample-tag{font-size:10px;color:#879990}.reset{border:0;background:transparent;color:#9ebdac;font-size:12px;padding:0;align-self:flex-start;margin-top:18px}.compact-id{font-family:ui-monospace,monospace;color:#899991;font-size:10px;word-break:break-all}.compare-old{border:0;background:none;color:#7f9289;cursor:pointer;text-align:left;padding:0;font-size:11px}.old{font-size:11px;color:#a3b2aa;border-top:1px solid #55645c;padding-top:12px;margin-top:13px}.old code{font-size:10px;overflow-wrap:anywhere}.hidden{display:none!important}
  @media(max-width:1000px){.shell{padding:25px 24px 130px}.workspace{grid-template-columns:135px 1fr}.sidebar{padding-left:7px;padding-right:7px}.stage{grid-template-columns:minmax(0,1fr) 370px}.window{padding:20px}.notice-area{padding:21px 17px}}@media(max-width:760px){.shell{padding:20px 17px 130px}.intro{margin-top:35px}.intro h1{font-size:30px}.intro p{font-size:13px}.controls .hint{width:100%;margin:4px 0 0}.stage{display:flex;flex-direction:column-reverse}.notice-area{border:0;border-bottom:1px solid #3a4546;min-height:355px;padding:22px;align-items:center}.os-label,.notification,.native-note{width:100%;max-width:400px}.os-label{margin-bottom:18px}.native-note{margin-top:20px;padding-top:0}.workspace{min-height:340px;grid-template-columns:118px 1fr}.sidebar-title{padding-left:6px}.window{padding:19px 16px}.conversation{padding:24px 0}.conversation h2{font-size:20px}.brief{grid-template-columns:1fr;gap:19px;margin-top:22px}.prototype-bar{bottom:16px;gap:2px;padding:5px}.prototype-label{min-width:128px;font-size:11px;padding:0 5px}.prototype-bar button{width:32px;height:32px}.prototype-bar .variant-button{width:26px;height:26px}.brand{font-size:13px}.pill{font-size:10px}.request{font-size:12px}}
</style>
<div class="shell">
  <header class="top"><div class="brand"><span class="brand-icon">GS</span>GhostSentinel<span style="color:#63766b;font-weight:400">/</span>通知原型</div><span class="pill">一次性原型 · 示例数据</span></header>
  <section class="intro"><span class="eyebrow">NOTIFICATION DESIGN / 01</span><h1>一眼看懂，哪个聊天需要关注。</h1><p>让问题、影响和下一步出现在提醒里。点击通知，预览它将带你回到哪里。</p></section>
  <div class="controls"><div class="seg" aria-label="提醒场景"><button data-scenario="failure">监控故障</button><button data-scenario="alert">任务异常</button></div><span class="hint">原生通知布局由 macOS 决定，这里比较内容层级和点击行为。</span></div>
  <section class="stage" aria-label="通知及聊天跳转预览">
    <div class="workspace"><aside class="sidebar"><div class="sidebar-title">CODEX · 聊天示意</div><div class="project">⌄ Ghost 项目</div><button class="chat-nav" data-chat="0">支付回调验收</button><button class="chat-nav active" data-chat="1">通知点击跳转</button><button class="chat-nav" data-chat="2">账单导出修复</button><button class="chat-nav" data-chat="3">登录状态检查</button><button class="chat-nav" data-chat="4">模型配置检查</button></aside><div class="window"><div class="window-top"><span>Codex</span><span id="destination-tag">当前聊天</span></div><div class="conversation" id="conversation"></div><div class="compose">向 Codex 发送消息… <span style="float:right">↑</span></div></div></div>
    <aside class="notice-area"><div class="os-label"><strong>通知中心</strong><span>星期六 · 23:48</span></div><div id="notifications" style="width:100%"></div><div class="native-note" id="native-note"></div></aside>
  </section>
  <div class="toast" id="status" role="status" aria-live="polite">点击右侧提醒，查看目标聊天。</div>
  <section class="brief"><div><h3><span class="variant-mark" id="variant-mark"></span><span id="variant-title"></span></h3><p id="variant-description"></p></div><div><h3>提醒应回答什么</h3><p id="meaning"></p></div><div><h3>边界与取舍</h3><p id="tradeoff"></p></div></section>
</div>
<nav class="prototype-bar" aria-label="原型方案切换"><button id="previous" aria-label="上一个方案">←</button><div class="prototype-label" id="prototype-label"></div><button class="variant-button" data-variant="A">A</button><button class="variant-button" data-variant="B">B</button><button class="variant-button" data-variant="C">C</button><button id="next" aria-label="下一个方案">→</button></nav>
<script>
  const chats=[{title:'支付回调验收',request:'检查支付回调的签名、重试和幂等行为，确认验收结果。',activity:'回调重试测试正在执行，最近两次验证仍报告同一项失败。'},{title:'通知点击跳转',request:'点击异常提醒后，打开这条提醒所属的聊天。',activity:'正在检查系统通知的点击回调和会话定位。'},{title:'账单导出修复',request:'修复账单导出的日期范围，并确认 CSV 内容。',activity:'导出代码已调整，等待下一次完整验证。'},{title:'登录状态检查',request:'检查刷新页面之后，登录态是否正确保留。',activity:'正在对照会话刷新前后的状态。'},{title:'模型配置检查',request:'核对本安装模型配置和服务连接状态。',activity:'正在检查模型服务的连接状态。'}]
  const variants={A:{name:'聊天优先',description:'先看见熟悉的聊天名，再看状态。适合同时开着多个聊天、需要立刻认出对象的场景。',meaning:'这是哪个聊天？它现在需要关注，还是暂时无法检查？',tradeoff:'聊天名长时会占用标题空间。故障原因必须控制在一行到两行。'},B:{name:'问题优先',description:'先说发生了什么，再标明聊天和下一步。正文解释影响，技术原因留在检查详情。',meaning:'为什么提醒我？它影响了什么？点击之后能做什么？',tradeoff:'区分任务异常与监控故障；不会把“检查失败”写成“你的任务失败”。'},C:{name:'合并摘要',description:'相同来源的一组监控故障收成一条摘要，先告诉你影响范围，再展开具体聊天。',meaning:'多少个聊天受影响？哪些聊天有问题？从哪里开始查看？',tradeoff:'跨聊天摘要需要新增可打开的受影响会话列表。这里仅演示该交互，尚未接入真实通知。'}}
  let variant=new URLSearchParams(location.search).get('variant')||'B',scenario=new URLSearchParams(location.search).get('scenario')||'failure',selectedChat=1,summaryOpen=false
  if(!variants[variant])variant='B';if(!['failure','alert'].includes(scenario))scenario='failure'
  const $=id=>document.getElementById(id)
  function switchVariant(key){variant=key;summaryOpen=false;selectedChat=1;const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('scenario',scenario);history.replaceState(null,'',url);render()}
  function nextVariant(offset){const keys=Object.keys(variants);switchVariant(keys[(keys.indexOf(variant)+offset+keys.length)%keys.length])}
  function content(){const failure=scenario==='failure';if(variant==='A')return {title:chats[0].title,subtitle:failure?'本轮检查暂不可用':'需要关注 · 连续验证失败',body:failure?'暂时无法读取这条聊天的记录，检查结果尚未更新。点击返回聊天查看详情。':'最近两次重试仍是同一项失败。点击回到聊天，核对失败原因。',action:'打开「支付回调验收」'};if(variant==='B')return {title:failure?'这条聊天的检查结果未更新':'连续重试仍未通过验证',subtitle:'支付回调验收',body:failure?'会话记录暂时读不到，当前无法给出新的检查结论。点击回到聊天核对。':'最近两次重试没有解决同一项失败。建议先核对失败原因，再继续。',action:'点击进入对应聊天'};return {title:failure?'5 个聊天暂时无法检查':'1 个聊天有 3 项待关注',subtitle:failure?'会话记录读取异常 · 同类故障已合并':'支付回调验收',body:failure?'这些聊天暂时没有新的检查结果。点击查看受影响的聊天，再进入具体会话。':'重复失败、验证尚未通过、等待时间偏长。点击回到聊天查看依据。',action:failure?'查看受影响聊天（原型）':'打开「支付回调验收」'}}
  function renderConversation(){document.querySelectorAll('[data-chat]').forEach(el=>el.classList.toggle('active',Number(el.dataset.chat)===selectedChat&&!summaryOpen));if(summaryOpen){$('destination-tag').textContent='汇总入口 · 原型';$('conversation').innerHTML='<div class="context-label">监控故障 · 受影响聊天</div><h2>5 个聊天的检查暂不可用</h2><p class="request">读取会话记录时出现同类问题。当前没有新的检查结论。</p><div class="affected-list">'+chats.map((chat,index)=>'<button class="affected-item" data-open="'+index+'"><strong>'+chat.title+'</strong><span>记录暂不可用 · 点击进入聊天 ↗</span></button>').join('')+'</div>';document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openChat(Number(el.dataset.open)));return}const chat=chats[selectedChat];$('destination-tag').textContent=selectedChat===1?'当前聊天':'已进入提醒所属聊天';$('conversation').innerHTML='<div class="context-label">'+(selectedChat===1?'正在查看':'通知点击目标')+'</div><h2>'+chat.title+'</h2><p class="request">'+chat.request+'</p><div class="message">'+chat.activity+'</div>'}
  function openChat(index){summaryOpen=false;selectedChat=index;renderConversation();$('status').textContent='已模拟跳转到「'+chats[index].title+'」。真实实现将使用通知保存的会话 ID。'}
  function clickNotice(){if(variant==='C'&&scenario==='failure'){summaryOpen=true;renderConversation();$('status').textContent='原型：打开受影响聊天列表。列表中的每一项都定位到自己的聊天。'}else openChat(0)}
  function render(){const design=variants[variant],notice=content(),failure=scenario==='failure';$('variant-mark').textContent=variant+' /';$('variant-title').textContent=design.name;$('variant-description').textContent=design.description;$('meaning').textContent=design.meaning;$('tradeoff').textContent=design.tradeoff;$('prototype-label').textContent=variant+' — '+design.name;document.querySelectorAll('[data-variant]').forEach(el=>el.setAttribute('aria-current',String(el.dataset.variant===variant)));document.querySelectorAll('[data-scenario]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.scenario===scenario)));$('notifications').innerHTML='<button class="notification" id="primary-notice" aria-label="'+notice.action+'"><div class="app-line"><span class="app-icon">GS</span>GHOSTSENTINEL<time>现在</time></div><h2 class="notice-title">'+notice.title+'</h2><div class="notice-subtitle"><span class="state-dot '+(failure?'':'alert')+'"></span>'+notice.subtitle+'</div><p class="notice-body">'+notice.body+'</p><div class="notice-foot">'+notice.action+'</div></button>'+(variant==='A'?'<div class="notification secondary"><div class="app-line"><span class="app-icon">GS</span>GHOSTSENTINEL<time>1 分钟前</time></div><div class="notice-title">账单导出修复</div><p class="notice-body">'+(failure?'本轮检查暂不可用，结果尚未更新。':'验证尚未完成，结论仍待确认。')+'</p></div>':'');$('primary-notice').onclick=clickNotice;$('native-note').innerHTML='<b>'+(variant==='C'&&failure?'同类故障合并成一条，保留各聊天的独立记录。':'点击才跳转；提醒出现时，不切换你正在查看的聊天。')+'</b><br>完整身份和错误码保留在诊断详情。<br><button class="compare-old" id="compare-old">对照当前提醒 ↓</button><div class="old hidden" id="old-notice">GhostSentinel · 监控状态提醒<br>来源：<code>00000000-0000-4000-8000-000000000001</code><br>主聊天：<code>00000000-0000-4000-8000-000000000002…</code></div>';$('compare-old').onclick=()=>$('old-notice').classList.toggle('hidden');$('status').textContent='当前：'+variant+' · '+design.name+' / '+(failure?'监控故障':'任务异常')+'。点击右侧提醒，预览目标。';renderConversation()}
  document.querySelectorAll('[data-variant]').forEach(el=>el.onclick=()=>switchVariant(el.dataset.variant));document.querySelectorAll('[data-scenario]').forEach(el=>el.onclick=()=>{scenario=el.dataset.scenario;switchVariant(variant)});document.querySelectorAll('[data-chat]').forEach(el=>el.onclick=()=>openChat(Number(el.dataset.chat)));$('previous').onclick=()=>nextVariant(-1);$('next').onclick=()=>nextVariant(1);document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,[contenteditable="true"]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();nextVariant(event.key==='ArrowLeft'?-1:1)}});render()
</script>
</html>
