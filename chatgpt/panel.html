<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel 会话检查</title>
<style>
:root{font:13px/1.5 system-ui;color-scheme:light dark}body{margin:0;padding:14px;overflow-wrap:anywhere}h1{font-size:14px;margin:0 0 8px}p{margin:5px 0}#summary{font-weight:600;font-size:14px}#analysis,.muted{color:GrayText;font-size:12px}.issue{padding:10px 0;border-bottom:1px solid color-mix(in srgb,GrayText 22%,transparent)}h2{font-size:13px;margin:0 0 4px}.evidence{white-space:pre-line;font-size:12px;color:GrayText;line-height:1.45;margin-top:5px}#checks,#history,#diagnostics,#last-summary{margin-top:16px}#diagnostics>h2,#history>h2,#last-summary>h2{color:GrayText}.check{padding:8px 0;border-bottom:1px solid color-mix(in srgb,GrayText 15%,transparent)}.check-status{font-size:12px;font-weight:400;margin-left:8px;color:GrayText}#coverage,#technical,#observation,#execution{white-space:pre-line}#error{color:GrayText;font-size:12px}.history-entry{display:block;width:100%;text-align:left;margin:5px 0;padding:6px 8px;font:inherit;border:1px solid GrayText;border-radius:5px;background:transparent;color:inherit;overflow-wrap:anywhere}.history-entry[aria-current=true]{border-width:2px;font-weight:600}
#gs-bar{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:4px 8px;padding:10px 0;background:var(--color-background-primary,Canvas);border-bottom:1px solid color-mix(in srgb,GrayText 20%,transparent)}
#recent-heading{display:flex;align-items:baseline;gap:8px;min-width:0}
#session-light{flex:none}
#recent-blocking{min-width:0;margin:0}
#recent-blocking-reason{grid-column:1/-1;margin:0;color:GrayText}
#recent-blocking-details{margin:5px 0;font-size:12px}
#monitor-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 14px}
#monitor-tabs{display:flex;gap:18px}#monitor-tabs button{border:0;border-bottom:2px solid transparent;padding:6px 0;background:transparent;color:GrayText;font:inherit;cursor:pointer}#monitor-tabs button[aria-selected=true]{border-bottom-color:currentColor;color:inherit;font-weight:600}
#refresh{padding:3px 7px;border:1px solid color-mix(in srgb,GrayText 35%,transparent);border-radius:5px;background:transparent;color:inherit;font:inherit;font-size:12px;cursor:pointer}
#recent-model-activity{padding:5px 0 10px;border-bottom:1px solid color-mix(in srgb,GrayText 20%,transparent)}
.recent-model-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:3px 8px;min-height:25px;font-size:12px}
.recent-model-value{display:flex;align-items:baseline;justify-content:flex-end;flex-wrap:wrap;gap:5px;margin-left:auto}
.recent-model-value time,#recent-summary-time{font-size:11px;color:GrayText;font-variant-numeric:tabular-nums;white-space:nowrap}
#recent-summary-time{grid-column:2;justify-self:end}
.recent-model-badge{font-size:10px;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,GrayText 15%,transparent)}
.recent-model-badge[data-tone=ok]{background:light-dark(#e1efe7,#20372c);color:light-dark(#26543b,#a3d6b4)}
.recent-model-badge[data-tone=waiting]{background:light-dark(#f9edd8,#382e20);color:light-dark(#674a22,#ecc88e)}
.recent-model-badge[data-tone=failed]{background:light-dark(#f8e4e2,#3a2628);color:light-dark(#7b302e,#f0aaa6)}
#recent-summary-row{border-top:1px solid color-mix(in srgb,GrayText 15%,transparent);margin-top:5px;padding-top:5px}
#recent-summary-gaps{margin:6px 0 0;font-size:11px}
.summary-body:not(.muted){font-size:15px;line-height:1.65}.summary-body p{margin:8px 0}.summary-body .summary-row{display:grid;grid-template-columns:6em minmax(0,1fr);column-gap:10px}.summary-row strong{font-weight:650}.summary-row span{white-space:pre-wrap}
@media(max-width:420px){.summary-body .summary-row{grid-template-columns:1fr;row-gap:2px}}
.blocking{margin-top:10px}.blocking p{margin:4px 0}.blocking details{font-size:12px}
.blocking [data-status="blocked"],#recent-blocking-status[data-status="blocked"]{color:light-dark(#a32323,#ffabab)}
#overview-totals{font-size:14px;font-weight:600}#overview-list article{padding:10px 0;border-bottom:1px solid color-mix(in srgb,GrayText 20%,transparent)}
#overview-pagination{display:flex;align-items:center;gap:10px;margin-top:12px}#overview-pagination button{font:inherit}
#overview-pagination[hidden],#gs-bar[data-overview=true]{display:none}
</style>
<header id="gs-bar" aria-label="当前会话判断">
  <div id="recent-heading">
    <span id="session-light" role="img" hidden></span>
    <p id="recent-blocking" hidden>JEV · <strong id="recent-blocking-status"></strong></p>
  </div>
  <time id="recent-summary-time" aria-label="更新时间" hidden></time>
  <p id="recent-blocking-reason" hidden></p>
</header>
<div id="current-context">
<details id="recent-blocking-details" hidden><summary>查看判断依据</summary><div id="recent-blocking-evidence"></div></details>
<section id="recent-model-activity" aria-label="本聊天最近的预填和总结">
  <div class="recent-model-row"><strong>上次送预填</strong><div class="recent-model-value"><time id="recent-prefill-time" hidden></time><span id="recent-prefill-state" class="recent-model-badge">待核对</span></div></div>
  <p id="recent-prefill-recovery" class="muted" role="status" hidden></p>
  <div class="recent-model-row" id="recent-summary-row"><strong>上次总结</strong><div class="recent-model-value"><span id="recent-summary-state" class="recent-model-badge" hidden></span></div></div>
  <div id="recent-summary-text" class="summary-body muted">等待核对当前聊天</div><p id="recent-summary-gaps" class="muted" hidden></p>
  <p id="recent-model-status" class="muted" role="status" hidden></p>
</section>
<p id="availability" class="muted" role="status" hidden></p>
<p id="collection-recovery" class="muted" role="status" hidden></p>
</div>
<div id="monitor-controls"><nav id="monitor-tabs" role="tablist" aria-label="会话检查"><button id="monitor-tab-issues" type="button" role="tab" aria-controls="issues">当前问题</button><button id="monitor-tab-details" type="button" role="tab" aria-controls="monitor-details">详情</button><button id="monitor-tab-overview" type="button" role="tab" aria-controls="overview">总览</button></nav><button id="refresh" type="button">刷新</button></div>
<section id="issues" role="tabpanel" aria-labelledby="monitor-tab-issues" aria-label="需要关注的问题"></section>
<section id="overview" role="tabpanel" aria-labelledby="monitor-tab-overview" hidden>
<p id="overview-totals"></p><button id="overview-pause" type="button" hidden>暂停分析</button><p id="overview-status" class="muted" role="status"></p><div id="overview-list"></div>
<div id="overview-pagination" hidden><button id="overview-prev" type="button">上一页</button><span id="overview-range" class="muted"></span><button id="overview-next" type="button">下一页</button></div>
</section>
<section id="monitor-details" role="tabpanel" aria-labelledby="monitor-tab-details" hidden>
<h1>Sentinel · 当前会话</h1>
<p id="summary" role="status">⚪ 正在核对当前会话</p>
<p id="execution" class="muted"></p>
<p id="record-status" class="muted" role="status"></p>
<section id="current-facts" hidden><p id="current-request" class="muted"></p><p id="current-activity" class="muted"></p></section>
<p id="inheritance" class="muted" role="status"></p>
<p id="analysis">当前分析不可判断</p>
<p id="model-status" class="muted"></p>
<section id="model-summary" hidden><h2 id="model-summary-title">模型总结</h2><div id="model-summary-text" class="summary-body"></div><div id="model-blocking" class="blocking" hidden><p>JEV 阻塞判断 · <strong id="model-blocking-status"></strong></p><details id="model-blocking-details" hidden><summary>查看判断依据</summary><div id="model-blocking-evidence"></div></details></div><p id="model-summary-gaps" class="muted"></p><div id="model-summary-evidence" class="evidence"></div></section>
<p id="health" class="muted" role="status"></p>
<button id="pause" type="button" hidden>暂停本聊天分析</button>
<section id="detail-issues" aria-label="所选检查的问题与依据"></section>
<section id="checks"><h2>六项检查</h2><div id="check-list"></div></section>
<section id="history" hidden><h2>24 小时内的检查记录</h2><button id="history-current" type="button">返回当前／最近一轮</button><div id="history-list"></div><button id="history-more" type="button" hidden>较早记录</button><p id="history-gap" class="muted"></p><section id="last-summary" hidden><h2>上次成功总结</h2><p id="last-summary-time" class="muted"></p><div id="last-summary-text" class="summary-body"></div><div id="last-blocking" class="blocking" hidden><p>JEV 阻塞判断 · <strong id="last-blocking-status"></strong></p><details id="last-blocking-details" hidden><summary>查看判断依据</summary><div id="last-blocking-evidence"></div></details></div><div id="last-summary-evidence" class="evidence"></div></section></section>
<section id="diagnostics"><h2 id="diagnostics-title">观察与覆盖</h2><p id="identity" class="muted"></p><p id="coverage" class="muted"></p><p id="observation" class="muted"></p><div id="gaps" class="muted"></div><p id="technical" class="muted"></p></section>
<p id="error" role="status"></p>
</section>
<script>
const labels={stalled_progress:'活跃但推进不足',request_drift:'偏离当前请求',failure_loop:'同类失败反复返工',validation_cost:'完整验证重复成本',validation_gap:'本地验证证据缺口',long_wait:'长等待或活动中断'};
const lights={red:'🔴',yellow:'🟡',green:'🟢',gray:'⚪'};
const lightLabels={red:'告警',yellow:'观察',green:'正常',gray:'不可判断'};
const states={queued:'检查排队中',analyzing:'正在检查',unavailable:'本地模型未配置或不可用',failed:'本轮分析失败',unknown:'当前分析不可判断',cooldown:'本轮检查已更新',idle:'最近检查结果',paused:'分析已暂停',stale:'检查已过期',interrupted:'本轮检查已取消','not-connected':'六项分析尚未接入'};
const executions={running:'运行中',idle:'已结束',ended:'已结束',aborted:'已中断',unknown:'结束状态未确认'};
const element=id=>document.querySelector('#'+id);
function set(id,key,value){const target=element(id);if(target[key]!==value)target[key]=value;}
const write=(id,value)=>set(id,'textContent',value);
function writeSummary(id,value,sections){
  const folded=sections?null:value.match(/^(在做什么：[\s\S]+?)\s*(有什么进展：[\s\S]+?)\s*(卡在哪里：[\s\S]+)$/);
  if(folded)sections=folded.slice(1).map(line=>line.trim());
  if(sections)value=sections.join('\n');
  if(element(id).textContent===value)return;
  const lines=sections??value.split(/\r?\n/);
  if(lines.length===1){write(id,value);return;}
  element(id).replaceChildren(...lines.map((line,index)=>{
    const ending=index<lines.length-1?'\n':'';
    const parts=line.match(/^(在做什么：|有什么进展：|卡在哪里：)([\s\S]+)$/);
    if(!parts)return node('p',line+ending);
    const row=node('p','','summary-row');
    row.append(node('strong',parts[1]),node('span',parts[2]+ending));
    return row;
  }));
}
const show=(id,visible)=>set(id,'hidden',!visible);
function attribute(id,key,value){const target=element(id);if(target.getAttribute(key)!==value)target.setAttribute(key,value);}
function updateRows(id,rows){
  const target=element(id),previous=[...target.children];
  for(const [index,row] of rows.entries()){
    const current=previous[index];
    if(!current)target.append(row);
    else if(!current.isEqualNode(row))target.replaceChild(row,current);
  }
  for(const row of previous.slice(rows.length))target.removeChild(row);
}
const text=(value,max=240)=>typeof value==='string'?value.trim().slice(0,max):'';
const list=value=>Array.isArray(value)?value:[];
const count=value=>Number.isSafeInteger(value)&&value>=0?String(value):'—';
const prefillStates={prefilling:['预填中','waiting'],completed:['已完成','ok'],failed:['失败','failed'],unknown:['状态未确认','waiting'],cancel_requested:['取消中','waiting'],cancelled:['已取消',''],unsupported:['当前模型不支持',''],unconfirmed:['预填支持未确认',''],'time-unrecorded':['发送时间未记录','']};
const recoveryStates={waiting:'新总结等待重试',queued:'新总结等待并发名额',generating:'新总结生成中',judging:'新总结正在判断',unknown:'新总结状态待确认',cancel_requested:'新总结正在取消',completed:'补跑已结束',failed:'补跑失败',interrupted:'补跑已中断',paused:'分析已暂停'};
const summaryTimeFormat=new Intl.DateTimeFormat(undefined,{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const gapDescriptions={'Current user request is unverified':'当前请求尚未核实，执行活动继续监控',current_request_evidence_missing:'缺少当前请求证据',current_request_text_missing:'缺少当前请求正文','Older native records were removed at the capture limit':'达到采集留存上限，较旧记录已移出观察窗口','未识别原生响应材料类型：additional_tools':'旧版工具目录提示，已按声明元数据处理',no_applicable_semantic_checks:'本次观察未触发语义检查','tool-result-image-omitted':'图片未纳入文本观察',analysis_evidence_budget:'本轮仅使用预算内的部分记录',judgment_evidence_budget:'JEV 使用预算内的部分记录',event_excerpt_or_capture_gap:'部分记录截断或存在采集缺口','Some observed excerpts are truncated':'部分记录截断','Some observed content was omitted for privacy':'敏感内容已省略',native_file_change_contents_unverified:'文件变更正文未完整核实',capture_coverage_unconfirmed:'采集覆盖未完整确认',analysis_input_budget:'判断材料超过预算',judgment_evidence_insufficient:'判断执行活动的证据不足',extraction_evidence_gap:'模型提取的证据存在缺口'};
function summaryGaps(gaps){
  const derived=new Set(['event_excerpt_or_capture_gap','capture_coverage_unconfirmed','extraction_evidence_gap']);
  const specific=gaps.some(gap=>text(gap)&&!derived.has(gap));
  return [...new Set(gaps.filter(gap=>text(gap)&&(!specific||!derived.has(gap))).map(gap=>Object.hasOwn(gapDescriptions,gap)?gapDescriptions[gap]:gap.includes('unsupported-item-type:')?'存在未识别的原生事件':text(gap,160)))];
}
function renderRecentModelActivity(activity,retained=false,revalidating=false){
  const now=Date.now(),prefill=activity?.prefill,summary=activity?.summary;
  const recent=at=>Number.isFinite(at)&&at<=now&&at>now-86400000;
  const time=(id,at)=>{
    const visible=recent(at);
    show(id,visible);write(id,visible?summaryTimeFormat.format(at):'');
    set(id,'dateTime',visible?new Date(at).toISOString():'');
  };
  const validPrefill=prefill&&(prefill.submittedAt==null||recent(prefill.submittedAt));
  const [label,tone]=validPrefill&&Object.hasOwn(prefillStates,prefill.state)?prefillStates[prefill.state]:[activity?'暂无记录':'待核对',''];
  write('recent-prefill-state',label);
  attribute('recent-prefill-state','data-tone',tone);
  time('recent-prefill-time',prefill?.submittedAt);
  const recovery=activity?.prefillRecovery;
  const recoveryLabel=Object.hasOwn(recoveryStates,recovery?.summaryState)?recoveryStates[recovery.summaryState]:'';
  show('recent-prefill-recovery',Boolean(recoveryLabel));
  write('recent-prefill-recovery',recoveryLabel?'旧预填待释放 · '+recoveryLabel:'');
  const valid=recent(summary?.completedAt)&&summary.expiresAt>now&&Boolean(text(summary.text,Infinity));
  show('recent-summary-state',valid);write('recent-summary-state',valid?(summary.final?'已收尾':'已总结'):'');
  attribute('recent-summary-state','data-tone','ok');
  set('recent-summary-text','className',valid?'summary-body':'summary-body muted');
  writeSummary('recent-summary-text',valid?text(summary.text,Infinity):activity?'暂无可显示的总结':'等待核对当前聊天',valid?summary.sections:null);
  const decision=valid?(summary.blocking??{status:'unknown',reason:summary.final?'执行已收尾，未作运行中判断':'这份摘要没有可显示的 JEV 判断'}):null;
  renderBlocking('recent',decision,retained||revalidating);
  time('recent-summary-time',valid?summary.completedAt:null);
  const missing=valid&&summary.partial?summaryGaps(list(summary.gaps)):[];
  show('recent-summary-gaps',missing.length>0);write('recent-summary-gaps',missing.length?'观察范围与说明 · '+missing.join('、'):'');
  const showRetained=retained&&Boolean(valid||validPrefill);
  show('recent-model-status',showRetained);write('recent-model-status',showRetained?'本次未能更新 · 显示上次读取':'');
  return activity?{prefill:validPrefill?prefill:null,summary:valid?summary:null,prefillRecovery:recovery}:null;
}
let id=0,timer=null,busy=false,stopped=false,generation=0,ready=false,controlState=null,scopeThreadId=null,selectedExecutionKey=null,historyCursor=null,nextHistoryCursor=null,recentActivity=null;
let monitorTab='issues',overviewOffset=0,nextOverviewOffset=null,overviewPaused=null;
const pending=new Map();
function selectTab(tab){
  monitorTab=tab;
  for(const name of ['issues','details','overview'])element('monitor-tab-'+name).setAttribute('aria-selected',String(name===tab));
  element('issues').hidden=tab!=='issues';element('monitor-details').hidden=tab!=='details';
  show('overview',tab==='overview');show('current-context',tab!=='overview');
  attribute('gs-bar','data-overview',String(tab==='overview'));
}
for(const tab of ['issues','details','overview'])element('monitor-tab-'+tab).onclick=()=>{
  const changesScope=(monitorTab==='overview')!==(tab==='overview');
  selectTab(tab);
  if(tab==='issues'&&(selectedExecutionKey||historyCursor))return selectExecution(null,null);
  if(changesScope)void refresh();
};
selectTab('issues');
const overviewCounts=counts=>Object.entries(lights).map(([color,light])=>light+' '+String(counts?.[color]??0)).join('  ');
function renderOverview(overview,message){
  const rows=list(overview?.rows);
  overviewPaused=typeof overview?.monitoring?.paused==='boolean'?overview.monitoring.paused:null;
  show('overview-pause',overviewPaused!==null);write('overview-pause',overviewPaused?'继续分析':'暂停分析');
  write('overview-totals',overview?'会话 '+count(overview.total)+' · '+overviewCounts(overview.counts):'');
  write('overview-status',overview?(rows.length?'':'暂无可显示的会话'):text(message)||'总览暂不可用，正在自动重试');
  updateRows('overview-list',rows.map(row=>{
    const card=node('article','');
    const status=row.connected?(executions[row.status]??'状态待确认'):'来源已断开';
    const updated=Number.isFinite(row.updatedAt)?' · '+summaryTimeFormat.format(row.updatedAt):'';
    card.append(node('h2',text(row.title)||'未命名会话'),node('p',overviewCounts(row.counts)+' · '+status+updated,'muted'));
    const source=[text(row.source),row.complete===false?'观察覆盖有缺口':''].filter(Boolean).join(' · ');
    if(source)card.append(node('p',source,'muted'));
    if(row.connected&&text(row.reason))card.append(node('p',text(row.reason)));
    return card;
  }));
  nextOverviewOffset=overview?.nextOffset??null;
  show('overview-pagination',Boolean(overview&&(overview.offset>0||nextOverviewOffset!==null)));
  set('overview-prev','disabled',!overview||overview.offset===0);set('overview-next','disabled',nextOverviewOffset===null);
  write('overview-range',rows.length?(overview.offset+1)+'–'+(overview.offset+rows.length)+' / '+overview.total:'');
}
element('overview-prev').onclick=()=>{if(!busy){overviewOffset=Math.max(0,overviewOffset-30);void refresh();}};
element('overview-next').onclick=()=>{if(!busy&&nextOverviewOffset!==null){overviewOffset=nextOverviewOffset;void refresh();}};
element('overview-pause').onclick=async()=>{
  if(busy||overviewPaused===null)return;
  busy=true;set('overview-pause','disabled',true);
  try{
    await request('tools/call',{name:'sentinel_set_overview_monitoring',arguments:{paused:!overviewPaused}});
  }catch(error){write('overview-status',text(error.message));}
  finally{set('overview-pause','disabled',false);completeOperation();}
};
function renderSessionLight(view,signal='gray'){
  const identity=text(view?.identity?.threadId,128),history=view?.history;
  const historical=view?.execution?.historical===true;
  const status=history?.currentStatus??(historical?'unknown':view?.execution?.status??view?.observation?.status);
  const active=Boolean(identity)&&!['ended','idle','disposed','aborted'].includes(status);
  const light=historical&&Object.hasOwn(lights,history?.currentSignal)?history.currentSignal:historical?'gray':signal;
  show('session-light',active);
  write('session-light',active?lights[light]:'');
  attribute('session-light','aria-label',active?'当前会话 · '+lightLabels[light]:'');
}
renderSessionLight(null);
function resetDetails(){
  controlState=null;set('pause','disabled',false);
  renderBlocking('model',null);renderBlocking('last',null);
  for(const name of ['pause','availability','collection-recovery','model-summary','last-summary','current-facts','history','history-more'])show(name,false);
  for(const name of ['identity','coverage','observation','technical','error','health','execution','record-status','current-request','current-activity','inheritance','history-gap','model-status','model-summary-text','model-summary-gaps','last-summary-time','last-summary-text','availability'])write(name,'');
  for(const name of ['issues','detail-issues','check-list','gaps','history-list','model-summary-evidence','last-summary-evidence'])updateRows(name,[]);
  write('model-summary-title','模型总结');write('analysis','当前分析不可判断');write('diagnostics-title','观察与覆盖');
}
function clearView(message){
  resetDetails();renderSessionLight(null);
  scopeThreadId=null;selectedExecutionKey=null;historyCursor=null;nextHistoryCursor=null;recentActivity=null;
  renderRecentModelActivity(null);
  write('summary','⚪ '+message);attribute('summary','data-signal','gray');
}
function node(tag,value,className){const child=document.createElement(tag);if(value)child.textContent=value;if(className)child.className=className;return child;}
function renderHealth(health){
  if(health?.state==='failed'){
    const failures=list(health.failures);
    if(failures.length&&!health.hasMore&&failures.every(failure=>failure.domain==='analysis'&&failure.error?.category==='cache-busy')){
      write('health','总结恢复中 · GMD 缓存占用');
      return;

    if(response.structuredContent?.identity?.threadId!==state.taskId)throw new Error('当前聊天身份已变化');
    if(selectedExecutionKey||historyCursor){
      response=await request('tools/call',{name:'sentinel_current_chat',arguments:readArguments()});
      if(stopped||g!==generation)return;
      if(response.isError||response.structuredContent?.identity?.threadId!==state.taskId)throw new Error('历史检查读取尚未确认');
    }
    render(response.structuredContent);
  }catch(error){if(!stopped&&g===generation){clearView('本聊天暂停状态未确认');element('error').textContent='刷新后可重试';element('technical').textContent=text(error.message);}}
  finally{completeOperation();}
}
element('pause').onclick=setPaused;
element('history-current').onclick=()=>selectExecution(null,null);
element('history-more').onclick=()=>nextHistoryCursor?selectExecution(selectedExecutionKey,nextHistoryCursor):undefined;
function visibility(){dismissedGeneration=-1;clearTimeout(timer);timer=null;if(!document.hidden&&!busy)void refresh();}
function teardown(){stopped=true;generation++;clearTimeout(timer);timer=null;for(const [id,entry]of pending)cancel(id,entry,'页面已销毁');removeEventListener('message',onMessage);removeEventListener('visibilitychange',visibility);}
addEventListener('visibilitychange',visibility);addEventListener('pagehide',teardown,{once:true});
(async()=>{try{const init=await request('ui/initialize',{appInfo:{name:'ghost-sentinel-chatgpt',version:'0.1.0-dev.1'},appCapabilities:{},protocolVersion:'2026-01-26'});if(stopped)return;const execution=init?.hostContext?.sentinelExecution;if(text(execution?.threadId,2000)&&text(execution?.key,2000)){scopeThreadId=execution.threadId;selectedExecutionKey=execution.key;selectTab('details');}if(init?.hostContext?.sentinelOverviewOnly){show('monitor-tab-issues',false);show('monitor-tab-details',false);selectTab('overview');}ready=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');await refresh();}catch(error){clearView('宿主初始化未完成');element('error').textContent='可稍后重试';element('technical').textContent=text(error.message);}})();
</script>
</html>
