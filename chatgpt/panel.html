<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel 会话检查</title>
<style>
:root{font:13px/1.5 system-ui;color-scheme:light dark}body{margin:0;padding:14px;overflow-wrap:anywhere}h1{font-size:14px;margin:0 0 8px}p{margin:5px 0}#summary{font-weight:600;font-size:14px}#analysis,.muted{color:GrayText;font-size:12px}.issue{padding:10px 0;border-bottom:1px solid color-mix(in srgb,GrayText 22%,transparent)}h2{font-size:13px;margin:0 0 4px}.evidence{white-space:pre-line;font-size:12px;color:GrayText;line-height:1.45;margin-top:5px}#checks,#history,#diagnostics,#last-summary{margin-top:16px}#diagnostics>h2,#history>h2,#last-summary>h2{color:GrayText}.check{padding:8px 0;border-bottom:1px solid color-mix(in srgb,GrayText 15%,transparent)}.check-status{font-size:12px;font-weight:400;margin-left:8px;color:GrayText}#coverage,#technical,#observation,#execution{white-space:pre-line}#error{color:GrayText;font-size:12px}.history-entry{display:block;width:100%;text-align:left;margin:5px 0;padding:6px 8px;font:inherit;border:1px solid GrayText;border-radius:5px;background:transparent;color:inherit;overflow-wrap:anywhere}.history-entry[aria-current=true]{border-width:2px;font-weight:600}
#gs-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--color-background-primary,Canvas);border-bottom:1px solid color-mix(in srgb,GrayText 20%,transparent)}#gs-bar strong{font-size:13px;margin-right:auto}#gs-bar span{font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}#monitor-tabs{display:flex;gap:18px;margin:10px 0 14px}#monitor-tabs button{border:0;border-bottom:2px solid transparent;padding:6px 0;background:transparent;color:GrayText;font:inherit;cursor:pointer}#monitor-tabs button[aria-selected=true]{border-bottom-color:currentColor;color:inherit;font-weight:600}
#refresh{padding:3px 7px;border:1px solid color-mix(in srgb,GrayText 35%,transparent);border-radius:5px;background:transparent;color:inherit;font:inherit;font-size:12px;cursor:pointer}
#recent-model-activity{padding:5px 0 10px;border-bottom:1px solid color-mix(in srgb,GrayText 20%,transparent)}
.recent-model-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:3px 8px;min-height:25px;font-size:12px}
.recent-model-value{display:flex;align-items:baseline;justify-content:flex-end;flex-wrap:wrap;gap:5px;margin-left:auto}
.recent-model-value time{font-size:11px;color:GrayText;font-variant-numeric:tabular-nums;white-space:nowrap}
.recent-model-badge{font-size:10px;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,GrayText 15%,transparent)}
.recent-model-badge[data-tone=ok]{background:light-dark(#e1efe7,#20372c);color:light-dark(#26543b,#a3d6b4)}
.recent-model-badge[data-tone=waiting]{background:light-dark(#f9edd8,#382e20);color:light-dark(#674a22,#ecc88e)}
.recent-model-badge[data-tone=failed]{background:light-dark(#f8e4e2,#3a2628);color:light-dark(#7b302e,#f0aaa6)}
#recent-summary-row{border-top:1px solid color-mix(in srgb,GrayText 15%,transparent);margin-top:5px;padding-top:5px}
#recent-summary-text{margin:2px 0 0;font-size:12px}#recent-summary-gaps{margin:4px 0 0;font-size:11px}
</style>
<header id="gs-bar" aria-label="GS · 当前主聊天"><strong>GS</strong><span id="gs-green" aria-label="正常">🟢 0</span><span id="gs-yellow" aria-label="观察">🟡 0</span><span id="gs-red" aria-label="告警">🔴 0</span><span id="gs-gray" aria-label="不可判断">⚪ 0</span><button id="refresh" type="button">刷新</button></header>
<section id="recent-model-activity" aria-label="本聊天最近的预填和总结">
  <div class="recent-model-row"><strong>上次送预填</strong><div class="recent-model-value"><time id="recent-prefill-time" hidden></time><span id="recent-prefill-state" class="recent-model-badge">待核对</span></div></div>
  <div class="recent-model-row" id="recent-summary-row"><strong>上次总结</strong><div class="recent-model-value"><span id="recent-summary-state" class="recent-model-badge" hidden></span><time id="recent-summary-time" hidden></time></div></div>
  <p id="recent-summary-text" class="muted">等待核对当前聊天</p><p id="recent-summary-gaps" class="muted" hidden></p>
  <p id="recent-model-status" class="muted" role="status" hidden></p>
</section>
<p id="availability" class="muted" role="status" hidden></p>
<p id="collection-recovery" class="muted" role="status" hidden></p>
<nav id="monitor-tabs" role="tablist" aria-label="会话检查"><button id="monitor-tab-issues" type="button" role="tab" aria-controls="issues">当前问题</button><button id="monitor-tab-details" type="button" role="tab" aria-controls="monitor-details">详情</button></nav>
<section id="issues" role="tabpanel" aria-labelledby="monitor-tab-issues" aria-label="需要关注的问题"></section>
<section id="monitor-details" role="tabpanel" aria-labelledby="monitor-tab-details" hidden>
<h1>Sentinel · 当前会话</h1>
<p id="summary" role="status">⚪ 正在核对当前会话</p>
<p id="execution" class="muted"></p>
<p id="record-status" class="muted" role="status"></p>
<section id="current-facts" hidden><p id="current-request" class="muted"></p><p id="current-activity" class="muted"></p></section>
<p id="inheritance" class="muted" role="status"></p>
<p id="analysis">当前分析不可判断</p>
<p id="model-status" class="muted"></p>
<section id="model-summary" hidden><h2 id="model-summary-title">模型总结</h2><p id="model-summary-text"></p><p id="model-summary-gaps" class="muted"></p><div id="model-summary-evidence" class="evidence"></div></section>
<p id="health" class="muted" role="status"></p>
<button id="pause" type="button" hidden>暂停本聊天分析</button>
<section id="detail-issues" aria-label="所选检查的问题与依据"></section>
<section id="checks"><h2>六项检查</h2><div id="check-list"></div></section>
<section id="history" hidden><h2>24 小时内的检查记录</h2><button id="history-current" type="button">返回当前／最近一轮</button><div id="history-list"></div><button id="history-more" type="button" hidden>较早记录</button><p id="history-gap" class="muted"></p><section id="last-summary" hidden><h2>上次成功总结</h2><p id="last-summary-time" class="muted"></p><p id="last-summary-text"></p><div id="last-summary-evidence" class="evidence"></div></section></section>
<section id="diagnostics"><h2 id="diagnostics-title">观察与覆盖</h2><p id="identity" class="muted"></p><p id="coverage" class="muted"></p><p id="observation" class="muted"></p><div id="gaps" class="muted"></div><p id="technical" class="muted"></p></section>
<p id="error" role="status"></p>
</section>
<script>
const labels={stalled_progress:'活跃但推进不足',request_drift:'偏离当前请求',failure_loop:'同类失败反复返工',validation_cost:'完整验证重复成本',validation_gap:'本地验证证据缺口',long_wait:'长等待或活动中断'};
const lights={red:'🔴',yellow:'🟡',green:'🟢',gray:'⚪'};
const states={queued:'检查排队中',analyzing:'正在检查',unavailable:'本地模型未配置或不可用',failed:'本轮分析失败',unknown:'当前分析不可判断',cooldown:'本轮检查已更新',idle:'最近检查结果',paused:'分析已暂停',stale:'检查已过期',interrupted:'本轮检查已取消','not-connected':'六项分析尚未接入'};
const executions={running:'运行中',idle:'已结束',ended:'已结束',aborted:'已中断',unknown:'结束状态未确认'};
const element=id=>document.querySelector('#'+id);
function set(id,key,value){const target=element(id);if(target[key]!==value)target[key]=value;}
const write=(id,value)=>set(id,'textContent',value);
const show=(id,visible)=>set(id,'hidden',!visible);
function attribute(id,key,value){const target=element(id);if(target.getAttribute(key)!==value)target.setAttribute(key,value);}
function updateRows(id,rows){
  const target=element(id),previous=[...target.children];
  for(const [index,row] of rows.entries()){
    const current=previous[index];
    if(!current)target.append(row);
    else if(!current.isEqualNode(row))target.replaceChild(row,current);
  }
  for(const row of previous.slice(rows.length))target.removeChild(row);
}
const text=(value,max=240)=>typeof value==='string'?value.trim().slice(0,max):'';
const list=value=>Array.isArray(value)?value:[];
const count=value=>Number.isSafeInteger(value)&&value>=0?String(value):'—';
const prefillStates={prefilling:['预填中','waiting'],completed:['已完成','ok'],failed:['失败','failed'],unknown:['状态未确认','waiting'],cancel_requested:['取消中','waiting'],cancelled:['已取消',''],unsupported:['当前模型不支持',''],unconfirmed:['预填支持未确认',''],'time-unrecorded':['发送时间未记录','']};
const summaryTimeFormat=new Intl.DateTimeFormat(undefined,{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
const gapDescriptions={'Current user request is unverified':'当前请求尚未核实，执行活动继续监控',current_request_evidence_missing:'缺少当前请求证据',current_request_text_missing:'缺少当前请求正文','Older native records were removed at the capture limit':'采集缓存最多 100 条，较旧材料已移出观察窗口','未识别原生响应材料类型：additional_tools':'旧版工具目录提示，已按声明元数据处理',no_applicable_semantic_checks:'本次观察未触发语义检查','tool-result-image-omitted':'图片未纳入文本观察',analysis_evidence_budget:'本轮仅使用预算内的部分记录',event_excerpt_or_capture_gap:'部分记录截断或存在采集缺口','Some observed excerpts are truncated':'部分记录截断','Some observed content was omitted for privacy':'敏感内容已省略',native_file_change_contents_unverified:'文件变更正文未完整核实',capture_coverage_unconfirmed:'采集覆盖未完整确认',analysis_input_budget:'判断材料超过预算',judgment_evidence_insufficient:'判断执行活动的证据不足',extraction_evidence_gap:'模型提取的证据存在缺口'};
function summaryGaps(gaps){
  const derived=new Set(['event_excerpt_or_capture_gap','capture_coverage_unconfirmed','extraction_evidence_gap']);
  const specific=gaps.some(gap=>text(gap)&&!derived.has(gap));
  return [...new Set(gaps.filter(gap=>text(gap)&&(!specific||!derived.has(gap))).map(gap=>Object.hasOwn(gapDescriptions,gap)?gapDescriptions[gap]:gap.includes('unsupported-item-type:')?'存在未识别的原生事件':text(gap,160)))];
}
function renderRecentModelActivity(activity,retained=false){
  const now=Date.now(),prefill=activity?.prefill,summary=activity?.summary;
  const recent=at=>Number.isFinite(at)&&at<=now&&at>now-86400000;
  const time=(id,at)=>{
    const visible=recent(at);
    show(id,visible);write(id,visible?summaryTimeFormat.format(at):'');
    set(id,'dateTime',visible?new Date(at).toISOString():'');
  };
  const validPrefill=prefill&&(prefill.submittedAt==null||recent(prefill.submittedAt));
  const [label,tone]=validPrefill&&Object.hasOwn(prefillStates,prefill.state)?prefillStates[prefill.state]:[activity?'暂无记录':'待核对',''];
  write('recent-prefill-state',label);
  attribute('recent-prefill-state','data-tone',tone);
  time('recent-prefill-time',prefill?.submittedAt);
  const valid=recent(summary?.completedAt)&&summary.expiresAt>now&&Boolean(text(summary.text,600));
  show('recent-summary-state',valid);write('recent-summary-state',valid?'已总结':'');
  attribute('recent-summary-state','data-tone','ok');
  set('recent-summary-text','className',valid?'':'muted');
  write('recent-summary-text',valid?text(summary.text,600):activity?'暂无可显示的总结':'等待核对当前聊天');
  time('recent-summary-time',valid?summary.completedAt:null);
  const missing=valid&&summary.partial?summaryGaps(list(summary.gaps)):[];
  show('recent-summary-gaps',missing.length>0);write('recent-summary-gaps',missing.length?'观察范围与说明 · '+missing.join('、'):'');
  const showRetained=retained&&Boolean(valid||validPrefill);
  show('recent-model-status',showRetained);write('recent-model-status',showRetained?'本次未能更新 · 显示上次读取':'');
  return activity?{prefill:validPrefill?prefill:null,summary:valid?summary:null}:null;
}
let id=0,timer=null,busy=false,stopped=false,generation=0,ready=false,controlState=null,scopeThreadId=null,selectedExecutionKey=null,historyCursor=null,nextHistoryCursor=null,recentActivity=null;
const pending=new Map();
function selectTab(tab){
  for(const name of ['issues','details'])element('monitor-tab-'+name).setAttribute('aria-selected',String(name===tab));
  element('issues').hidden=tab!=='issues';element('monitor-details').hidden=tab!=='details';
}
for(const tab of ['issues','details'])element('monitor-tab-'+tab).onclick=()=>{selectTab(tab);if(tab==='issues'&&(selectedExecutionKey||historyCursor))return selectExecution(null,null);};
selectTab('issues');
function renderGS(view,signal='gray'){
  const identity=text(view?.identity?.threadId,128),history=view?.history;
  const historical=view?.execution?.historical===true;
  const status=history?.currentStatus??(historical?'unknown':view?.execution?.status??view?.observation?.status);
  const active=Boolean(identity)&&!['ended','idle','disposed','aborted'].includes(status);
  const light=historical&&Object.hasOwn(lights,history?.currentSignal)?history.currentSignal:historical?'gray':signal;
  for(const name of ['green','yellow','red','gray'])write('gs-'+name,lights[name]+' '+(active&&light===name?'1':'0'));
}
renderGS(null);
function resetDetails(){
  controlState=null;set('pause','disabled',false);
  for(const name of ['pause','availability','collection-recovery','model-summary','last-summary','current-facts','history','history-more'])show(name,false);
  for(const name of ['identity','coverage','observation','technical','error','health','execution','record-status','current-request','current-activity','inheritance','history-gap','model-status','model-summary-text','model-summary-gaps','last-summary-time','last-summary-text','availability'])write(name,'');
  for(const name of ['issues','detail-issues','check-list','gaps','history-list','model-summary-evidence','last-summary-evidence'])updateRows(name,[]);
  write('model-summary-title','模型总结');write('analysis','当前分析不可判断');write('diagnostics-title','观察与覆盖');
}
function clearView(message){
  resetDetails();renderGS(null);
  scopeThreadId=null;selectedExecutionKey=null;historyCursor=null;nextHistoryCursor=null;recentActivity=null;
  renderRecentModelActivity(null);
  write('summary','⚪ '+message);attribute('summary','data-signal','gray');
}
function node(tag,value,className){const child=document.createElement(tag);if(value)child.textContent=value;if(className)child.className=className;return child;}
function renderHealth(health){
  if(health?.state==='failed'){
    const failures=list(health.failures);
    if(failures.length&&!health.hasMore&&failures.every(failure=>failure.domain==='analysis'&&failure.error?.category==='cache-busy')){
      write('health','总结恢复中 · GMD 缓存占用');
      return;
    }
    const reasons=failures.slice(0,3).map(failure=>failure.error?.category==='cache-busy'?'GMD 缓存占用':(failure.domain==='collection'?'采集':'分析')+'失败'+(text(failure.error?.code,80)?'（'+text(failure.error.code,80)+'）':''));
    write('health',(health.orderingGap?'监控曾有失败 · 恢复状态未确认 · ':'监控故障 · ')+(reasons.join('；')||'本轮监控不可用'));
  }else write('health',health?.state==='recovered'?'监控已恢复':'');
}
function stateLine(analysis){
  const parts=[analysis.error?.category==='cache-busy'?'总结恢复中':states[analysis.state]??'分析状态未确认'];
  if(Number.isFinite(analysis.waitMs)&&analysis.waitMs>=1000)parts.push('排队 '+Math.floor(analysis.waitMs/1000)+' 秒');
  if(Number.isFinite(analysis.lagMs)&&analysis.lagMs>=1000)parts.push('分析滞后 '+Math.floor(analysis.lagMs/1000)+' 秒');
  return parts.join(' · ');
}
function readArguments(){return selectedExecutionKey||historyCursor?{...(selectedExecutionKey?{executionKey:selectedExecutionKey}:{}),...(historyCursor?{historyCursor}:{}),expectedThreadId:scopeThreadId}:{};}
function selectExecution(key,cursor=historyCursor){
  if(stopped||!ready||!scopeThreadId)return;
  if(key)selectTab('details');
  selectedExecutionKey=key;historyCursor=cursor;generation++;clearTimeout(timer);timer=null;resetDetails();
  write('summary','⚪ 正在读取检查记录');attribute('summary','data-signal','gray');renderGS({identity:{threadId:scopeThreadId}},'gray');
  return refresh();
}
function renderHistory(view){
  const history=view.history,entries=list(history?.executions),rows=[];
  if(history){historyCursor=text(history.cursor,256)||null;nextHistoryCursor=text(history.nextCursor,256)||null;}
  set('history-current','disabled',Boolean(history&&history.selectedKey===history.currentKey&&!historyCursor));
  show('history-more',Boolean(history&&nextHistoryCursor));
  for(const execution of entries.slice(0,20)){
    if(!text(execution?.key,256))continue;
    const time=Number.isFinite(execution.startedAt??execution.observedAt)?new Date(execution.startedAt??execution.observedAt).toLocaleString():'时间未确认';
    const button=node('button',time+' · '+(executions[execution.status]??'状态未确认'),'history-entry');
    button.type='button';button.setAttribute('data-execution-key',execution.key);button.setAttribute('aria-current',String(execution.key===history.selectedKey));button.onclick=()=>selectExecution(execution.key);rows.push(button);
  }
  if(history&&!entries.length)rows.push(node('p','暂无保留的已监控执行','muted'));
  updateRows('history-list',rows);
  write('history-gap',history?.historyGap?'先前的分页位置已过期，已返回最近记录':'');
  const execution=history&&view.execution;
  let caption='';
  if(execution?.historical)caption='历史执行 · '+(executions[execution.status]??'状态未确认')+(text(execution.request)?'\n'+text(execution.request):'');
  else if(execution&&execution.status!=='running')caption='最近执行 · '+(executions[execution.status]??'状态未确认');
  write('execution',caption);
}
const summaryEvidence=summary=>summary.evidence.slice(0,2).map(evidence=>node('p',[text(evidence.text,240),text(evidence.reference,2000)?'出处：'+text(evidence.reference,2000):''].filter(Boolean).join('\n'),'evidence'));
function render(view){
  if(!view||!Object.hasOwn(lights,view.signal)||!view.analysis||typeof view.analysis.state!=='string')throw new Error('未收到兼容的检查结果');
  const identity=text(view.identity?.threadId,128);
  if(!identity){
    clearView('当前会话未确认');
    if(view.observation?.gap==='observer-unavailable'){element('availability').textContent=text(view.summary)||'观察服务尚未就绪，等待数据';element('availability').hidden=false;}
    if(view.observation?.gap==='chat-archived'){write('availability','此聊天已归档，已退出监控');show('availability',true);}
    const gaps=[...list(view.discovery?.gaps),view.observation?.gap==='chat-archived'?null:view.observation?.gap,...(view.health?.historyGap?['监控故障回执存在保留缺口']:[]),...(view.health?.orderingGap?['故障恢复排序资料不完整']:[])].filter(value=>text(value));
    for(const gap of [...new Set(gaps)])element('gaps').append(node('p',text(gap,160)));
    if(gaps.length)element('diagnostics-title').textContent='观察与覆盖 · 有缺口';
    if(view.observation?.failureStage)element('observation').textContent='采集失败环节：'+(view.observation.failureStage==='core-connection'?'共享核心连接':text(view.observation.failureStage,120));
    renderHealth(view.health);
    return;
  }
  if(scopeThreadId!==identity){selectedExecutionKey=null;historyCursor=null;nextHistoryCursor=null;recentActivity=null;}
  scopeThreadId=identity;
  const recovery=view.collectionRecovery;
  const progress=Number.isFinite(recovery?.checkedBytes)&&recovery.totalBytes>0?'（'+Math.min(100,Math.floor(100*recovery.checkedBytes/recovery.totalBytes))+'%）':'';
  const recoveryMessage=({
    'verifying-prefix':'会话记录文件已变化 · 正在核验已读前缀，核验通过后自动续读',
    'prefix-mismatch':'会话记录与已核验前缀不一致 · 暂停续读，保留已有结果',
    'history-deferred':'历史补读已延后 · 正优先采集活跃会话，容量释放后自动恢复',
    'active-waiting':'当前采集暂缓 · 正在自动重试'
  })[recovery?.state]??'';
  write('collection-recovery',recoveryMessage+progress);show('collection-recovery',Boolean(recoveryMessage));
  const activityMissing=view.recentModelActivity===undefined;
  write('error','');write('availability','');show('availability',false);
  const analysis=view.analysis,byId=new Map(list(analysis.checks).filter(check=>check&&Object.hasOwn(labels,check.id)).map(check=>[check.id,check]));
  const inheritanceGap=view.inheritance&&(view.inheritance.state!=='complete'||list(view.inheritance.gaps).length>0);
  const recordRevalidating=!view.execution?.historical&&view.observation?.recordRevalidating===true;
  const cacheRecovery=analysis.state==='failed'&&analysis.error?.category==='cache-busy';
  let signal=view.signal,summary=text(view.summary)||'当前状态不可判断';
  const knownCheck=check=>check&&(check.status==='clear'||check.applicability?.state==='not-triggered');
  const checked=Object.keys(labels).filter(id=>knownCheck(byId.get(id))),missingChecks=Object.keys(labels).filter(id=>!knownCheck(byId.get(id)));
  const scoped=analysis.coverage?.checkEvidenceVersion===1&&Array.isArray(analysis.coverage.blockingGaps)&&analysis.coverage.blockingGaps.length===0;
  const scopedReady=scoped&&!list(analysis.checks).some(check=>check.status==='attention')&&(missingChecks.length===0||list(analysis.checks).some(check=>check.id!=='long_wait'&&check.status==='clear'));
  const green=(scoped?scopedReady:!inheritanceGap&&!list(analysis.coverage?.contextGaps).length&&analysis.coverage?.complete!==false&&!list(analysis.coverage?.dependencies).length&&Object.keys(labels).every(id=>knownCheck(byId.get(id))))&&view.health?.state!=='failed'&&!list(analysis.coverage?.dependencies).length&&analysis.connected===true&&['current','reused','pending'].includes(analysis.resultDisposition)&&!['not-connected','unknown','unavailable','failed','interrupted','stale'].includes(analysis.state);
  if(signal==='green'&&!green){signal='gray';summary=view.health?.state==='failed'?(view.health.orderingGap?'监控恢复状态未确认':'监控故障，当前状态不可判断'):inheritanceGap?'当前执行已接入，继承要求待补齐':states[analysis.state]??'当前分析不可判断';}

  const activityText=!view.execution?.historical?text(view.currentFacts?.activity?.summary,160):'';
  show('current-facts',Boolean(requestText||activityText));
  write('current-request',requestText?(recordRevalidating?'已核实请求：':'当前请求：')+requestText:activityText?'当前请求尚未核实 · 按执行记录监控':'');

  const partial=!analysis.generated&&analysis.coverage?.complete===false?analysis.partial:null;
  const generated=analysis.generated||partial,publishable=generated&&text(generated.text,600)&&Array.isArray(generated.evidence)&&generated.evidence.length&&!['failed','unavailable','interrupted','stale','unknown'].includes(analysis.state)&&(view.execution?.historical||['current','reused'].includes(analysis.resultDisposition));
  show('model-summary',Boolean(publishable));
  write('model-summary-text',publishable?text(generated.text,600):'');
  updateRows('model-summary-evidence',publishable?summaryEvidence(generated):[]);
  write('model-summary-title',publishable&&partial?(scoped?'本次观察总结':'部分观察总结'):'模型总结');
  let modelStatus='',modelGaps='';
  if(publishable){
    if(partial){
      const gaps=[...list(analysis.coverage?.gaps),...list(analysis.coverage?.verificationGaps),...list(analysis.coverage?.contextGaps),...list(analysis.coverage?.extractionGaps)];
      modelGaps=(scoped?'观察范围：':'观察缺口：')+summaryGaps(gaps).join('；');
      modelStatus=analysis.coverage?.checkEvidenceVersion===1?'总结已生成 · 已核对 '+checked.length+' 项'+(missingChecks.length?' · '+missingChecks.length+' 项证据不足':''):'总结模型：部分观察 · JEV：未形成完整判断';
    }else modelStatus=analysis.resultDisposition==='reused'?'总结模型／JEV：复用仍有效的结果':'总结模型：本轮成功 · JEV：本轮完成';
  }else if(cacheRecovery&&!view.execution?.historical){
    const retry=Number.isFinite(analysis.nextEligibleAt)&&analysis.nextEligibleAt>Date.now()?' · '+summaryTimeFormat.format(analysis.nextEligibleAt)+' 后可重试':'';
    modelStatus='GMD 缓存占用 · 自动重试'+retry;
  }else if(analysis.error?.stage==='llm')modelStatus='总结模型：本轮失败 · JEV：未完成';
  else if(analysis.error?.stage==='jev')modelStatus='总结模型：证据已整理 · JEV：本轮失败';

  write('model-status',modelStatus);write('model-summary-gaps',modelGaps);
  renderHealth(view.health);
  renderHistory(view);
  const prior=analysis.lastSuccessfulSummary,old=prior?.generated,readAt=Date.now();
  const priorVisible=Boolean((!publishable||partial)&&Number.isFinite(prior?.completedAt)&&prior.completedAt<=readAt&&Number.isFinite(prior.expiresAt)&&prior.expiresAt>readAt&&text(old?.text,600)&&Array.isArray(old.evidence)&&old.evidence.length);
  show('history',Boolean(view.history)||priorVisible);show('last-summary',priorVisible);
  write('last-summary-time',priorVisible?'历史记录 · 不代表当前结果 · '+new Date(prior.completedAt).toLocaleString():'');
  write('last-summary-text',priorVisible?text(old.text,600):'');
  updateRows('last-summary-evidence',priorVisible?summaryEvidence(old):[]);
  const monitoring=view.monitoring;
  controlState=monitoring?.taskId===identity&&typeof monitoring.paused==='boolean'&&text(monitoring.revision,2000)
    ?{taskId:identity,paused:monitoring.paused,revision:monitoring.revision}:null;
  const paused=controlState?.paused===true,currentSignal=paused?'gray':signal;
  show('pause',Boolean(controlState));set('pause','disabled',false);
  write('pause',paused?'恢复本聊天分析':'暂停本聊天分析');
  write('summary',paused?'⚪ 本聊天分析已暂停':lights[signal]+' '+summary);
  attribute('summary','data-signal',currentSignal);
  write('analysis',paused?'继续采集 · 仅手动恢复分析':(view.execution?.historical?'历史检查 · ':'')+stateLine(analysis));
  renderGS(view,currentSignal);
  const issues=list(analysis.issues).slice(0,6);

      if(target==='issues'||text(issue.reason)!==summary)article.append(node('p',text(issue.reason)));

    title.append(node('span',status,'check-status'));row.append(title,node('p',text(check?.reason)||'尚无此项检查结果','muted'));row.setAttribute('data-check',id);

  }));
  write('identity','本机主会话：'+identity);
  const discovery=view.discovery,coverage=[];

    coverage.push('已接入聊天 '+count(discovery.tracked)+' · 来源 '+count(discovery.connected));
    const counts=discovery.counts;
    if(counts)coverage.push('目录：主聊天 '+count(counts.main)+' · 分叉 '+count(counts.fork)+' · 远程 '+count(counts.remote)+' · 云端 '+count(counts.cloud)+' · 未分类 '+count(counts.unknown));
    coverage.push('发现覆盖：'+(discovery.complete===true?'已确认':'完整性尚未确认'));
  }
  if(analysis.coverage)coverage.push((view.inheritance?'当前执行材料覆盖：':'分析材料覆盖：')+(analysis.coverage.complete===true?'已确认':scoped?'有限观察窗口，检查按各自证据判断':'存在缺口'));
  if(view.inheritance)coverage.push('继承要求：'+(inheritanceGap?'待补齐或存在缺口':'已核实'));
  write('coverage',coverage.join('\n'));
  const recordStates={'caught-up':'已追平','catching-up':'正在补读','partial-record':'等待记录写完','retained-history':'保留的历史记录',gap:'存在缺口'};
  write('observation',view.observation?.gap==='chat-idle'?'暂无新活动 · 有新活动后自动监控':'执行记录：'+(recordStates[view.observation?.coverage]??'尚未确认'));
  const gaps=[...list(discovery?.gaps),...list(analysis.coverage?.gaps),...list(analysis.coverage?.contextGaps),...list(view.inheritance?.gaps),view.observation?.gap,view.history?.currentGap,...(view.health?.historyGap?['监控故障回执存在保留缺口']:[]),...(view.health?.orderingGap?['故障恢复排序资料不完整']:[])].filter(value=>text(value)&&value!=='chat-idle');
  updateRows('gaps',[...new Set(gaps)].map(gap=>node('p',text(gap,160))));
  write('diagnostics-title',gaps.length||inheritanceGap||discovery?.complete===false||analysis.coverage?.complete===false?'观察与覆盖 · 有缺口':'观察与覆盖');
  const technical=['分析状态：'+text(analysis.state,80)];
  if(text(analysis.error?.code,120))technical.push('错误代码：'+text(analysis.error.code,120));
  if(text(analysis.error?.message))technical.push(text(analysis.error.message));
  write('technical',technical.join('\n'));
  recentActivity=renderRecentModelActivity(activityMissing?recentActivity:view.recentModelActivity,activityMissing);
}
function cancel(id,entry,reason){pending.delete(id);clearTimeout(entry.timeout);if(entry.method==='tools/call')parent.postMessage({jsonrpc:'2.0',method:'notifications/cancelled',params:{requestId:id,reason}},'*');entry.reject(new Error(reason));}
function request(method,params){return new Promise((resolve,reject)=>{const n=++id,entry={resolve,reject,method,timeout:null};entry.timeout=setTimeout(()=>cancel(n,entry,'宿主响应超时'),5000);pending.set(n,entry);parent.postMessage({jsonrpc:'2.0',id:n,method,params},'*');});}
function completeOperation(){
  busy=false;clearTimeout(timer);timer=null;if(stopped||document.hidden)return;
  timer=setTimeout(refresh,1500);
}
const displayContextFields=new Set(['theme','styles','displayMode','availableDisplayModes','containerDimensions','locale','timeZone','platform','deviceCapabilities','safeAreaInsets','userAgent']);
function onMessage(event){
  if(event.source!==parent||event.data?.jsonrpc!=='2.0')return;
  const message=event.data;
  if(message.method){
    if(message.method==='ui/resource-teardown'){teardown();parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');return;}
    if(message.method==='ui/notifications/host-context-changed'){
      const fields=Object.keys(message.params??{});
      if(fields.length&&fields.every(field=>displayContextFields.has(field)))return;
      generation++;clearView('会话已变化，重新核对中');clearTimeout(timer);timer=null;
      if(ready&&!busy)void refresh();
    }
    return;
  }
  const entry=pending.get(message.id);if(!entry)return;
  pending.delete(message.id);clearTimeout(entry.timeout);
  message.error?entry.reject(new Error(message.error.message)):entry.resolve(message.result);
}
addEventListener('message',onMessage);
let dismissedGeneration=-1;
async function dismissDisplayed(view,g){const threadId=view?.identity?.threadId;if(!threadId||!view.notifications?.scope?.sourceKey||document.hidden||stopped||g!==generation||dismissedGeneration===g)return;dismissedGeneration=g;try{await request('tools/call',{name:'sentinel_dismiss_chat_notifications',arguments:{expectedThreadId:threadId}});}catch{}}
async function refresh(){
  if(stopped||document.hidden||busy||!ready)return;
  busy=true;const g=generation;
  try{
    const response=await request('tools/call',{name:'sentinel_current_chat',arguments:readArguments()});
    if(stopped||g!==generation)return;
    if(response.isError)throw new Error('当前检查读取失败');
    render(response.structuredContent);void dismissDisplayed(response.structuredContent,g);
  }catch(error){
    if(!stopped&&g===generation){
      resetDetails();renderGS(null);recentActivity=renderRecentModelActivity(recentActivity,true);
      write('summary','⚪ 本次读取失败，当前状态不可判断');attribute('summary','data-signal','gray');
      write('error','可稍后重试');write('technical',text(error.message));
    }
  }finally{completeOperation();}
}
element('refresh').onclick=()=>refresh();
async function setPaused(){
  if(stopped||busy||!ready||!controlState)return;
  const state=controlState,g=generation;clearTimeout(timer);timer=null;busy=true;element('pause').disabled=true;
  try{
    let response=await request('tools/call',{name:'sentinel_set_chat_analysis',arguments:{paused:!state.paused,expectedThreadId:state.taskId,revision:state.revision}});
    if(stopped||g!==generation)return;
    if(response.isError)throw new Error('本聊天暂停状态未确认');
    if(response.structuredContent?.identity?.threadId!==state.taskId)throw new Error('当前聊天身份已变化');
    if(selectedExecutionKey||historyCursor){
      response=await request('tools/call',{name:'sentinel_current_chat',arguments:readArguments()});
      if(stopped||g!==generation)return;
      if(response.isError||response.structuredContent?.identity?.threadId!==state.taskId)throw new Error('历史检查读取尚未确认');
    }
    render(response.structuredContent);
  }catch(error){if(!stopped&&g===generation){clearView('本聊天暂停状态未确认');element('error').textContent='刷新后可重试';element('technical').textContent=text(error.message);}}
  finally{completeOperation();}
}
element('pause').onclick=setPaused;
element('history-current').onclick=()=>selectExecution(null,null);
element('history-more').onclick=()=>nextHistoryCursor?selectExecution(selectedExecutionKey,nextHistoryCursor):undefined;
function visibility(){dismissedGeneration=-1;clearTimeout(timer);timer=null;if(!document.hidden&&!busy)void refresh();}
function teardown(){stopped=true;generation++;clearTimeout(timer);timer=null;for(const [id,entry]of pending)cancel(id,entry,'页面已销毁');removeEventListener('message',onMessage);removeEventListener('visibilitychange',visibility);}
addEventListener('visibilitychange',visibility);addEventListener('pagehide',teardown,{once:true});
(async()=>{try{await request('ui/initialize',{appInfo:{name:'ghost-sentinel-chatgpt',version:'0.1.0-dev.1'},appCapabilities:{},protocolVersion:'2026-01-26'});if(stopped)return;ready=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');await refresh();}catch(error){clearView('宿主初始化未完成');element('error').textContent='可稍后重试';element('technical').textContent=text(error.message);}})();
</script>
