.notification-settings{margin-top:4px}.notification-description{margin:0 0 16px}.notification-option{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}.notification-option label{display:flex;align-items:center;gap:10px;font-size:14px}.notification-option input{appearance:auto;display:inline-block;width:16px;min-height:0;height:16px;margin:0;accent-color:var(--text)}.notification-option p{margin:0;text-align:right}.notification-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px}.notification-toolbar p{margin:0}.permission{border-top:1px solid var(--border);margin-top:20px;padding-top:20px}.permission h2{font-size:14px}.permission button{margin-top:6px}.tab-card{border:1px solid var(--border);border-radius:12px;padding:20px;background:var(--surface)}.notification-record{border-top:1px solid var(--border);padding:16px 0;overflow-wrap:anywhere}.notification-record:first-child{border-top:0}.notification-record h2{font-size:14px}.notification-body{white-space:pre-wrap}.diagnostic-section{border-top:1px solid var(--border);padding-top:18px;margin-top:18px}.diagnostic-section h2{font-size:14px}.diagnostic-section p{overflow-wrap:anywhere}

<main>
<h1>Sentinel · 安装设置</h1>
<p class="muted page-description">配置本安装的模型与通知。关闭设置后，监控继续运行。</p>
<nav role="tablist" aria-label="安装设置"><button id="settings-tab-settings" type="button" role="tab" aria-controls="settings-pane-settings">设置</button><button id="settings-tab-notifications" type="button" role="tab" aria-controls="settings-pane-notifications">通知记录</button><button id="settings-tab-diagnostics" type="button" role="tab" aria-controls="settings-pane-diagnostics">连接诊断</button></nav>
<section id="settings-pane-settings" role="tabpanel" aria-labelledby="settings-tab-settings">
<form id="settings-form">
<div class="section-heading"><div><h2>分析模型</h2><p id="settings-status" role="status" class="muted"></p></div><button id="settings-reload" type="button">重新读取</button></div>
<div class="model-grid">
<fieldset id="settings-llm-group"><legend>总结模型</legend>
<label>服务地址<input id="settings-llm-url" type="url" placeholder="http://127.0.0.1:端口" autocomplete="off"></label>
<label>选择模型<select id="settings-llm-options" aria-describedby="settings-llm-list-status"></select></label><label>模型 ID（也可手填）<input id="settings-llm-model" autocomplete="off" placeholder="输入模型 ID"></label>
<div class="model-actions"><button id="settings-llm-list" type="button">读取列表</button><button id="settings-llm-check" type="button">检查连接</button></div><div class="model-status"><p id="settings-llm-list-status" class="muted"></p><p id="settings-llm-check-status" class="muted"></p><p id="settings-llm-status" class="muted"></p></div></fieldset>
<fieldset id="settings-jev-group"><legend>JEV 判断模型</legend>
<label>服务地址<input id="settings-jev-url" type="url" placeholder="http://127.0.0.1:端口" autocomplete="off"></label>
<label>选择模型<select id="settings-jev-options" aria-describedby="settings-jev-list-status"></select></label><label>模型 ID（也可手填）<input id="settings-jev-model" autocomplete="off" placeholder="输入模型 ID"></label>
<div class="model-actions"><button id="settings-jev-list" type="button">读取列表</button><button id="settings-jev-check" type="button">检查连接</button></div><div class="model-status"><p id="settings-jev-list-status" class="muted"></p><p id="settings-jev-check-status" class="muted"></p><p id="settings-jev-status" class="muted"></p></div></fieldset>
</div>
<p class="muted save-hint">选定模型或完成编辑后自动保存，未完成的输入保留为草稿。</p>
</form>
<fieldset class="notification-settings"><legend>桌面通知</legend>
<p class="muted notification-description">关闭只停止桌面提醒，监控照常运行。重新开启不补发历史通知。</p>
<div class="notification-option"><label><input id="settings-notification-task-alert" type="checkbox" disabled>任务告警</label><p id="settings-notification-task-alert-status" role="status" class="muted"></p></div>
<div class="notification-option"><label><input id="settings-notification-monitoring-failure" type="checkbox" disabled>监控故障</label><p id="settings-notification-monitoring-failure-status" role="status" class="muted"></p></div>
<div class="notification-toolbar"><p id="settings-notification-status" role="status" class="muted"></p><button id="settings-notification-reload" type="button">刷新通知设置</button></div>
<div class="permission"><h2>系统通知许可</h2><p id="settings-notification-permission-status" role="status" class="muted"></p><button id="settings-notification-permission" type="button">请求系统通知许可</button>
<p class="muted">系统允许不代表通知已显示或已被看到。</p></div>
</fieldset>
</section>
<section id="settings-pane-notifications" class="tab-card" role="tabpanel" aria-labelledby="settings-tab-notifications" hidden>
<p class="muted">本安装全部已监控聊天的两类通知，合计保留最近 24 小时内最新 1000 条。</p><button id="settings-notifications-refresh" type="button">刷新记录</button>
<p id="settings-notifications-status" role="status" class="muted"></p><p id="settings-notifications-gap" role="status" class="muted"></p><div id="settings-notifications-records"></div><button id="settings-notifications-older" type="button" hidden>较早记录</button>
</section>
<section id="settings-pane-diagnostics" class="tab-card" role="tabpanel" aria-labelledby="settings-tab-diagnostics" hidden>
<button id="diagnostics-refresh" type="button">刷新诊断</button><p id="diagnostics-status" class="muted"></p>
<div class="diagnostic-section"><h2>采集</h2><p id="diagnostics-collection"></p></div>
<div class="diagnostic-section"><h2>模型准备</h2><p id="diagnostics-model-llm"></p><p id="diagnostics-llm-check" class="muted"></p><p id="diagnostics-model-jev"></p><p id="diagnostics-jev-check" class="muted"></p></div>
<div class="diagnostic-section"><h2>实际分析</h2><p id="diagnostics-analysis"></p><p id="diagnostics-failure" class="muted"></p></div>
</section>
</main>
<script>
const element=id=>document.querySelector('#'+id),text=(value,max=2000)=>typeof value==='string'?value.slice(0,max):'';
let id=0,ready=false,stopped=false,settingsBusy=false,settingsState=null,settingsVersion=0,savingGroups=null,settingsTab='settings',diagnosticsBusy=false,diagnosticsVersion=0,diagnosticsRetryTimer=null,diagnosticsRetries=0,installationRegistrationId=null,notificationReadBusy=false,notificationReadVersion=0,permissionBusy=false,permissionVersion=0,notificationRecordsBusy=false,notificationRecordsVersion=0,notificationRecordsCursor=null;
const pending=new Map(),directoryVersions={llm:0,jev:0},directoryRequests={llm:{list:0,check:0},jev:{list:0,check:0}},editVersions={llm:0,jev:0},completedVersions={llm:0,jev:0},dirtyRoles=new Set(),queuedGroups=new Map();
const notificationKinds=['task-alert','monitoring-failure'],notificationEdits=Object.fromEntries(notificationKinds.map(kind=>[kind,{version:0,dirty:false,saving:false,queued:null}]));
function cancel(id,entry,reason){pending.delete(id);clearTimeout(entry.timeout);if(entry.method==='tools/call')parent.postMessage({jsonrpc:'2.0',method:'notifications/cancelled',params:{requestId:id,reason}},'*');entry.reject(new Error(reason));}
function request(method,params){return new Promise((resolve,reject)=>{const n=++id,entry={resolve,reject,method,name:params?.name,timeout:null};entry.timeout=setTimeout(()=>cancel(n,entry,'宿主响应超时'),5000);pending.set(n,entry);parent.postMessage({jsonrpc:'2.0',id:n,method,params},'*');});}
function applyHostTheme(context){if(['light','dark'].includes(context?.theme))document.documentElement.style.colorScheme=context.theme;}
function onMessage(event){if(event.source!==parent||event.data?.jsonrpc!=='2.0')return;const message=event.data;if(message.method){if(message.method==='ui/resource-teardown'){teardown();parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');}else if(message.method==='ui/notifications/host-context-changed')applyHostTheme(message.params);return;}const entry=pending.get(message.id);if(!entry)return;pending.delete(message.id);clearTimeout(entry.timeout);message.error?entry.reject(new Error(message.error.message)):entry.resolve(message.result);}
function validateModelSettings(value){
  if(!value||!text(value.registrationId)||!text(value.revision)||!value.config||typeof value.config!=='object'||Array.isArray(value.config)||installationRegistrationId&&installationRegistrationId!==value.registrationId)throw new Error('模型配置归属未确认');
  installationRegistrationId=value.registrationId;
}
function validateNotificationPreferences(value){
  if(!value||!text(value.registrationId)||!text(value.revision)||!notificationKinds.every(kind=>typeof value.preferences?.[kind]==='boolean')||installationRegistrationId&&installationRegistrationId!==value.registrationId)throw new Error('通知偏好归属或内容未确认');
  installationRegistrationId=value.registrationId;
}
function renderNotificationPermission(permission){
  if(permission!==null&&(!permission||!['unknown','not-determined','denied','authorized','provisional'].includes(permission.authorization)))throw new Error('系统通知许可结果未确认');
  element('settings-notification-permission-status').textContent=!permission?'系统通知许可未确认':permission.errorCode?'系统通知授权出错 · '+text(permission.errorCode):permission.requestInFlight?'系统通知授权处理中 · 可重新读取通知设置核对结果':({unknown:'系统通知许可未确认','not-determined':'系统通知许可尚未决定',denied:'系统通知未允许 · 可在系统设置中更改',authorized:'系统通知已允许',provisional:'系统通知临时允许'})[permission.authorization];
}
async function readNotificationPreferences(){
  if(stopped||document.hidden||!ready||notificationReadBusy)return;
  notificationReadBusy=true;const version=++notificationReadVersion,edits=Object.fromEntries(notificationKinds.map(kind=>[kind,{version:notificationEdits[kind].version,dirty:notificationEdits[kind].dirty}])),permissionReadVersion=permissionVersion;
  element('settings-notification-reload').disabled=true;element('settings-notification-status').textContent='正在读取本安装通知偏好';
  try{
    const response=await request('tools/call',{name:'sentinel_installation_notification_preferences',arguments:{}});
    if(stopped||version!==notificationReadVersion)return;if(response.isError)throw new Error('读取未确认');
    const value=response.structuredContent;validateNotificationPreferences(value);
    for(const kind of notificationKinds){const edit=notificationEdits[kind],checkbox=element('settings-notification-'+kind);checkbox.disabled=false;if(edit.dirty||edits[kind].dirty||edit.version!==edits[kind].version)continue;checkbox.checked=value.preferences[kind];element('settings-notification-'+kind+'-status').textContent=value.preferences[kind]?'已开启':'已关闭';}
    if(permissionVersion===permissionReadVersion)renderNotificationPermission(value.permission);
    element('settings-notification-status').textContent='本安装通知偏好 · 修改后立即保存';
  }catch(error){if(!stopped&&version===notificationReadVersion)element('settings-notification-status').textContent='通知偏好读取未确认 · '+text(error.message);}
  finally{if(!stopped&&version===notificationReadVersion){notificationReadBusy=false;element('settings-notification-reload').disabled=false;}}
}
async function saveNotificationPreference(kind){
  const edit=notificationEdits[kind];if(stopped||document.hidden||!ready||!installationRegistrationId||edit.saving||!edit.queued)return;
  const change=edit.queued;edit.queued=null;edit.saving=true;
  try{
    const response=await request('tools/call',{name:'sentinel_set_installation_notification_preference',arguments:{kind,enabled:change.enabled}});
    if(stopped)return;
    if(response.isError){if(response.structuredContent?.saveOutcome!=='rejected')throw new Error('保存响应未确认');if(edit.version===change.version)element('settings-notification-'+kind+'-status').textContent='保存失败 · 服务器拒绝写入，选择已保留';return;}
    const value=response.structuredContent;validateNotificationPreferences(value);if(value.preferences[kind]!==change.enabled)throw new Error('保存响应内容未确认');
    if(edit.version===change.version){edit.dirty=false;element('settings-notification-'+kind+'-status').textContent='已保存 · '+(change.enabled?'已开启':'已关闭');}
  }catch(error){if(!stopped&&edit.version===change.version)element('settings-notification-'+kind+'-status').textContent='保存结果未确认 · 选择已保留，可重新读取核对；'+text(error.message);}
  finally{if(!stopped){edit.saving=false;void saveNotificationPreference(kind);}}
}
async function requestInstallationNotificationPermission(){
  if(stopped||document.hidden||!ready||permissionBusy)return;
  permissionBusy=true;const version=++permissionVersion;element('settings-notification-permission').disabled=true;element('settings-notification-permission-status').textContent='正在请求系统通知许可';
  try{
    const response=await request('tools/call',{name:'sentinel_request_installation_notification_permission',arguments:{}});if(stopped||version!==permissionVersion)return;
    const value=response.structuredContent;if(response.isError||!value||!text(value.registrationId)||installationRegistrationId&&value.registrationId!==installationRegistrationId)throw new Error('系统通知授权结果未确认');
    renderNotificationPermission(value.permission);installationRegistrationId=value.registrationId;
  }catch(error){if(!stopped&&version===permissionVersion)element('settings-notification-permission-status').textContent='系统通知授权未确认 · '+text(error.message);}
  finally{if(!stopped&&version===permissionVersion){permissionBusy=false;element('settings-notification-permission').disabled=false;}}
}
function renderModelSettings(value){
  validateModelSettings(value);settingsState=value;
  for(const role of ['llm','jev']){
    if(dirtyRoles.has(role))continue;
    directoryVersions[role]++;element('settings-'+role+'-options').replaceChildren();
    for(const action of ['list','check']){element('settings-'+role+'-'+action).disabled=false;element('settings-'+role+'-'+action+'-status').textContent=action==='list'?'尚未读取列表':'尚未检查';}
    element('settings-'+role+'-url').value=value.config[role]?.baseUrl??'';element('settings-'+role+'-model').value=value.config[role]?.model??'';
    element('settings-'+role+'-status').textContent=value.config[role]?'已配置 · 实际分析状态另行核对':'尚未配置';
  }
  renderConnectionChecks();
}
async function readModelSettings(){
  if(stopped||document.hidden||!ready||settingsBusy)return;
  settingsBusy=true;const version=++settingsVersion;element('settings-reload').disabled=true;element('settings-status').textContent='正在读取模型设置';
  try{
    const response=await request('tools/call',{name:'sentinel_model_settings',arguments:{}});
    if(stopped||version!==settingsVersion)return;if(response.isError)throw new Error('模型设置读取失败');
    renderModelSettings(response.structuredContent);element('settings-status').textContent='本安装模型设置';
  }catch(error){if(!stopped&&version===settingsVersion)element('settings-status').textContent='模型设置读取失败 · '+text(error.message);}
  finally{if(!stopped&&version===settingsVersion){settingsBusy=false;element('settings-reload').disabled=false;void saveModelSettings();}}
}
function modelGroup(role){
  const baseUrl=element('settings-'+role+'-url').value.trim(),model=element('settings-'+role+'-model').value.trim();
  if(!baseUrl&&!model)return null;
  let url;try{url=new URL(baseUrl);}catch{throw new Error('请填写完整的本机服务地址和模型 ID');}
  if(!model||model.length>500||baseUrl.length>2000||!['http:','https:'].includes(url.protocol)||!['127.0.0.1','localhost','[::1]'].includes(url.hostname)||url.username||url.password||url.search||url.hash||!['','/'].includes(url.pathname))throw new Error('请填写有效的本机服务地址和模型 ID');

function sameGroup(left,right){return(left?.baseUrl??'')===(right?.baseUrl??'')&&(left?.model??'')===(right?.model??'');}
function completeModelGroup(role){
  if(stopped||editVersions[role]===completedVersions[role])return;

  completedVersions[role]=editVersions[role];

async function saveModelSettings(){
  if(stopped||document.hidden||!ready||settingsBusy||!settingsState||!queuedGroups.size)return;
  const config={...settingsState.config};savingGroups=new Map(queuedGroups);queuedGroups.clear();
  for(const [role,{group}] of savingGroups){if(group)config[role]=group;else delete config[role];}
  settingsBusy=true;const version=++settingsVersion;element('settings-reload').disabled=true;element('settings-status').textContent='正在保存';
  try{
    const response=await request('tools/call',{name:'sentinel_save_model_settings',arguments:{config,revision:settingsState.revision}});
    if(stopped||version!==settingsVersion)return;
    if(response.isError){if(response.structuredContent?.saveOutcome!=='rejected')throw new Error(text(response.content?.find(entry=>entry.type==='text')?.text)||'保存响应未确认');element('settings-status').textContent='保存失败 · 输入已保留';return;}
    const value=response.structuredContent;validateModelSettings(value);
    if(!['llm','jev'].every(role=>sameGroup(value.config[role],config[role])))throw new Error('保存响应内容未确认');

    for(const [role,entry] of savingGroups)if(entry.version===editVersions[role]){dirtyRoles.delete(role);element('settings-'+role+'-status').textContent=entry.group?'已配置 · 实际分析状态另行核对':'尚未配置';}
    element('settings-status').textContent='已保存 · 等待重新分析'+(dirtyRoles.size?' · 仍有未保存草稿':'');
  }catch(error){if(!stopped&&version===settingsVersion)element('settings-status').textContent='保存结果未确认 · 输入已保留，可重新读取核对；'+text(error.message);}

}
async function readDirectory(role,action){
  if(stopped||document.hidden||!ready||element('settings-'+role+'-'+action).disabled)return;
  const baseUrl=element('settings-'+role+'-url').value.trim(),selected=element('settings-'+role+'-model').value.trim(),version=directoryVersions[role],sequence=++directoryRequests[role][action],button=element('settings-'+role+'-'+action),status=element('settings-'+role+'-'+action+'-status');
  button.disabled=true;status.textContent=action==='list'?'正在读取候选模型':'正在检查连接（不调用推理）';
  const current=()=>!stopped&&version===directoryVersions[role]&&sequence===directoryRequests[role][action]&&baseUrl===element('settings-'+role+'-url').value.trim()&&selected===element('settings-'+role+'-model').value.trim();
  try{
    const response=await request('tools/call',{name:'sentinel_model_directory',arguments:{baseUrl}});if(!current())return;
    const value=response.structuredContent;if(response.isError||!value||!Array.isArray(value.models))throw new Error('模型目录读取失败');
    if(action==='list'){
      const options=element('settings-'+role+'-options'),placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='请选择模型或继续手填';options.replaceChildren(placeholder);
      for(const model of value.models.slice(0,256))if(text(model.id)&&(['unknown',role==='llm'?'summary':'jev'].includes(model.role)||model.role==='multiple'&&Array.isArray(model.roles)&&model.roles.includes(role==='llm'?'summary':'jev'))){
        const option=document.createElement('option');option.textContent=model.id+(model.role==='unknown'?'（能力未确认）':'');option.value=model.id;options.append(option);
      }
      options.value='';
      status.textContent=value.state==='online'?'已读取候选模型 · 可继续手填模型 ID':'目录未确认或不可用 · 可手填模型 ID';
    }else{

function renderConnectionChecks(){for(const role of ['llm','jev'])element('diagnostics-'+role+'-check').textContent='当前表单连接检查：'+(element('settings-'+role+'-check-status').textContent||'尚未检查');}

function cancelDiagnosticRetry(){clearTimeout(diagnosticsRetryTimer);diagnosticsRetryTimer=null;diagnosticsRetries=0;}
async function readDiagnostics(retry=false){
