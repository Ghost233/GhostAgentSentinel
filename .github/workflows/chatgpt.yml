name: ChatGPT adapter validation
on:
  push:
    branches:
      - dev
      - test
  pull_request:
    branches:
      - dev
      - main
permissions:
  contents: read
jobs:
  adapter:
    name: Check production ChatGPT observation boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            chatgpt/package-lock.json
      - name: Match the repository npm toolchain
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix chatgpt --ignore-scripts --no-audit --no-fund
      - run: node scripts/check.mjs
      - run: npm run test:chatgpt
